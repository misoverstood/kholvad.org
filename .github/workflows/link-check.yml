name: Link check

# Runs every Monday 09:00 UTC, whenever the link data or this file changes, and on demand.
on:
  schedule:
    - cron: "0 9 * * 1"
  push:
    branches: [gh-pages]
    paths:
      - "_data/links.yml"
      - ".github/workflows/link-check.yml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          # 403 and 429 are accepted because many government sites block automated checkers.
          args: >-
            --no-progress
            --max-retries 2
            --timeout 30
            --accept 200..=299,403,429
            --user-agent "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
            _data/links.yml
          fail: false

      - name: Open an issue if links are broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links found
          content-filepath: ./lychee/out.md
          labels: broken-links
